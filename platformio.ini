; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = freenove-fnk0099

[env]
framework = arduino
; Reads secrets.txt (gitignored) and injects WIFI_SSID/WIFI_PASSWORD/OTA_PASSWORD
; as compile-time defines. See secrets.txt.example for the format.
extra_scripts = pre:load_secrets.py
build_flags = -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO -D USE_ESP_IDF_LOG

[env:freenove-fnk0099]
platform = espressif32
board = freenove_esp32_s3_wroom
monitor_speed = 115200
lib_deps =
	SignalK/SensESP
	esp_websocket_client=https://components.espressif.com/api/downloads/?object_type=component&object_id=dbc87006-9a4b-45e6-a6ab-b286174cb413
	adafruit/Adafruit Unified Sensor@^1.1.15
	adafruit/Adafruit BMP3XX Library@^2.1.6
	adafruit/Adafruit INA3221 Library@^1.0.1

; OTA upload environment: `pio run -e freenove-fnk0099_ota -t upload`.
; The device address (-i) and --auth password are injected by load_secrets.py
; from secrets.txt (OTA_UPLOAD_PORT / OTA_PASSWORD). upload_port below is the
; fallback if OTA_UPLOAD_PORT is not set in secrets.txt.
[env:freenove-fnk0099_ota]
extends = env:freenove-fnk0099
upload_protocol = espota
upload_port = BatteryMonitor.local
