; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
framework = arduino
build_flags = -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO -D USE_ESP_IDF_LOG

[env:freenove-fnk0099]
platform = espressif32
board = freenove_esp32_s3_wroom
monitor_speed = 115200
lib_deps = 
	SignalK/SensESP
	esp_websocket_client=https://components.espressif.com/api/downloads/?object_type=component&object_id=dbc87006-9a4b-45e6-a6ab-b286174cb413
	adafruit/Adafruit Unified Sensor@^1.1.15
	adafruit/Adafruit BMP3XX Library@^2.1.6
    adafruit/Adafruit INA3221 Library@^1.0.1

upload_protocol = espota
upload_port = ""
upload_flags =
  --auth=""